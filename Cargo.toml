[package]
name = "daily-jigsaw"
authors = ["Alex Piquard <alex.piquard@hotmail.com>"]
edition = "2024"
description = "Play a different jigsaw puzzle each day"
license = "GPL-3.0-or-later"
repository = "https://github.com/AlexPiquard/daily-jigsaw"

[profile.release]
lto = true

[dependencies]
anyhow = "1.0.104"
flume = "0.12.0"
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }
rand = "0.9"
relm4 = { version = "0.11.0", features = ["libadwaita", "gnome_49"] }
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.4.0", features = ["json"] }
